[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfolio"
version = "0.1.0"
description = "Vectorized backtesting and multi-strategy portfolio research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
quantfolio = "quantfolio.cli:main"

[tool.setuptools.packages.find]
include = ["quantfolio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
